name: Publish image

# The GHCR builder for deployment to Eshobe CMS. It runs the shared check suite first,
# so a tag that would not pass typecheck / lint / tests / build can never produce an
# image. Publishing is tag-driven on purpose: the CMS records which ref a site was
# built from, and rolling back means deploying the previous tag (`v*` → `X.Y.Z`, `X.Y`).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (defaults to the selected branch or tag)
        required: false
        type: string

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    name: Build and push to GHCR
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Compute the image name
        # GHCR requires a lowercase repository path; `github.repository` preserves case.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
      - name: Job summary
        run: |
          {
            echo '### Image published'
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo 'Set `deployment.registryImageRepository` in `eshobe.theme.json` to the repository and deploy one of these immutable tags.'
          } >> "$GITHUB_STEP_SUMMARY"
