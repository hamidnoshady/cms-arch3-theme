name: Publish image

# Builds the theme image and pushes it to GHCR, then registers the pushed digest with
# Eshobe CMS. Registering is what makes the image deployable: the CMS never looks at
# GHCR, it only deploys a `theme-artifacts` row for the exact commit
# (docs/theme-artifacts.md in eshobe-cms).
#
# Runs on every merge to `main` (that is what the CMS deploys from), on `v*` tags, and
# by hand. The gate is `ci.yml`, so an image is never published from a red commit.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (defaults to the selected branch or tag)
        required: false
        type: string

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build, push to GHCR, register
    needs: ci
    runs-on: ubuntu-latest
    env:
      # Repository variables / secrets. Registration is skipped (with a warning) if unset.
      ESHOBE_CMS_URL: ${{ vars.ESHOBE_CMS_URL }}
      ESHOBE_THEME_PACKAGE_ID: ${{ vars.ESHOBE_THEME_PACKAGE_ID }}
      ESHOBE_THEME_ARTIFACT_SECRET: ${{ secrets.ESHOBE_THEME_ARTIFACT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Compute the image name and commit
        # GHCR requires a lowercase repository path; `github.repository` preserves case.
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=sha,prefix=,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image
      - name: Verify the pushed digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT: ${{ steps.image.outputs.commit }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          served="$(docker buildx imagetools inspect "$IMAGE:$COMMIT" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [ "$served" != "$DIGEST" ]; then
            echo "GHCR serves $served for $IMAGE:$COMMIT, expected $DIGEST" >&2
            exit 1
          fi
      - name: Register the artifact with Eshobe CMS
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT: ${{ steps.image.outputs.commit }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${ESHOBE_CMS_URL:-}" ] || [ -z "${ESHOBE_THEME_PACKAGE_ID:-}" ] || [ -z "${ESHOBE_THEME_ARTIFACT_SECRET:-}" ]; then
            echo '::warning::Image pushed but NOT registered: set repo variables ESHOBE_CMS_URL, ESHOBE_THEME_PACKAGE_ID and secret ESHOBE_THEME_ARTIFACT_SECRET. The CMS cannot deploy this commit until it is registered.'
            exit 0
          fi
          body="$(jq -nc \
            --arg repository "${GITHUB_REPOSITORY,,}" \
            --arg ref "$REF_NAME" \
            --arg commit "$COMMIT" \
            --arg image "$IMAGE" \
            --arg tag "$COMMIT" \
            --arg digest "$DIGEST" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{repository:$repository, ref:$ref, commit:$commit, registry:"ghcr", image:$image, tag:$tag, digest:$digest, workflowRunId:$runId, workflowRunUrl:$runUrl, platform:"linux/amd64"}')"
          sig="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$ESHOBE_THEME_ARTIFACT_SECRET" -hex | sed 's/^.* //')"
          curl -sS --fail-with-body --retry 3 --retry-all-errors \
            -X POST "${ESHOBE_CMS_URL%/}/api/platform/theme-packages/${ESHOBE_THEME_PACKAGE_ID}/artifacts" \
            -H 'Content-Type: application/json' \
            -H "X-Eshobe-Signature-256: $sig" \
            --data-binary "$body"
      - name: Job summary
        env:
          COMMIT: ${{ steps.image.outputs.commit }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Image published'
            echo
            echo "commit: \`$COMMIT\`"
            echo "digest: \`$DIGEST\`"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
